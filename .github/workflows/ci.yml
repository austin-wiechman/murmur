name: CI

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request makes its running build pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      # Only main saves the build folder, so every branch and the release workflow start from main's
      # compiled dependencies instead of rebuilding FluidAudio.
      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-
      - run: swift test
      - run: ./scripts/build-app.sh
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .build
          key: build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
